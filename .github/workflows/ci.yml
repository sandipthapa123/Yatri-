name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Three jobs that run side by side, so a push waits only as long as the slowest of them (the tests) instead of the sum.
  checks:
    name: Formatting, lint, types, API build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build shared package and API (catches runtime-import breakage)
        run: pnpm --filter @yatri/types build && pnpm --filter @yatri/api build
      - name: Dependency audit (runtime dependencies, high severity and above)
        run: pnpm audit --prod --audit-level=high

  tests:
    name: Tests (API, realtime, mobile packages)
    runs-on: ubuntu-latest
    # The whole API suite is about 1 000 tests against a real database; give it room so a slow runner is not a failure.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yatri
          POSTGRES_PASSWORD: yatri
          POSTGRES_DB: yatri_test
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yatri -d yatri_test" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare the test database
        working-directory: apps/api
        run: |
          cp .env.test.example .env.test
          pnpm migrate:test:up
      - name: Tests (API, realtime, mobile packages)
        run: |
          set -o pipefail
          pnpm -r --if-present test 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
      # The full log and the job summary need a signed-in account; annotations are public. On a failure, raise the
      # failing lines and the end of the test output as error annotations (newlines encoded as %0A), so the cause can be
      # read by anyone, including through the API: /repos/<owner>/<repo>/check-runs/<job id>/annotations.
      - name: Report test failures as annotations
        if: failure()
        run: |
          out="$RUNNER_TEMP/test-output.txt"
          enc() { sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | head -c 30000; }
          fails=$(grep -aE "FAIL |×|✗|Unhandled|Error:|ERR_|failed" "$out" | grep -v MaxListeners | head -60 | enc)
          tail_=$(tail -n 60 "$out" | enc)
          echo "::error title=Failing test lines::${fails}"
          echo "::error title=End of the test output::${tail_}"

  admin:
    name: Admin console build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the admin console
        env:
          API_BASE_URL: http://localhost:4000/api/v1
          JWT_ACCESS_SECRET: ci-only-signing-value-not-a-secret-0000000000
        # The admin console uses @yatri/types at run time from its compiled dist/, so build it first.
        run: pnpm --filter @yatri/types build && pnpm --filter @yatri/admin build

  mobile-bundles:
    name: Mobile bundles (Android export)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        app: [passenger, driver]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Export the ${{ matrix.app }} app
        working-directory: apps/${{ matrix.app }}
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/export-${{ matrix.app }}"

  images:
    name: Container images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API (runtime)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          target: runtime
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: API (migration job)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          target: migrate
          push: false
          cache-from: type=gha,scope=api
      - name: Admin console
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.admin
          push: false
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max
